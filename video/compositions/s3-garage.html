  <script>
    const tl = gsap.timeline({ paused: true });
    const show = (id, t) => tl.set("#" + id, { opacity: 1 }, t);
    const hide = (id, t) => tl.set("#" + id, { opacity: 0 }, t);
    // match cut : le compte-tours du plan 2 devient le logo de la vraie interface
    tl.fromTo("#s3-gauge", { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 1, opacity: 1 },
              { x: -864, y: -496, scale: 0.0785, duration: 0.7, ease: "power3.inOut" }, 0.05);
    tl.fromTo("#s3-grid", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.35);
    tl.set("#s3-gaugewrap", { opacity: 0 }, 0.78);
    tl.fromTo("#s3-cam", { scale: 1.5, transformOrigin: "0px 0px" }, { scale: 1.5, duration: 0.01 }, 0);
    // pause sur le logo, puis caméra vers la barre de recherche
    tl.to("#s3-cam", { scale: 1.55, transformOrigin: "1130px 50px", duration: 0.6, ease: "power3.inOut" }, 0.8);
    // curseur : arrive de bas à droite, clique dans la recherche
    tl.fromTo("#s3-cursor", { x: 1800, y: 700, opacity: 0 }, { x: 1096, y: 38, opacity: 1, duration: 0.7, ease: "power2.inOut" }, 0.8);
    tl.set("#s3-cursor", { scale: 1, transformOrigin: "0 0" }, 0);
    tl.to("#s3-cursor", { scale: 0.86, duration: 0.1, ease: "power2.out" }, 1.55);
    tl.to("#s3-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 1.65);
    // frappe réelle, 6 captures
    const tt = [1.72, 1.88, 2.04, 2.2, 2.36, 2.52];
    tt.forEach((t, i) => {
      show("s3-type" + (i + 1), t);
      if (i > 0) hide("s3-type" + i, t); else hide("s3-grid", t + 0.02);
    });
    // caméra reculée, curseur vers la carte, clic = lancement
    tl.to("#s3-cam", { scale: 1, transformOrigin: "0px 0px", duration: 0.6, ease: "power3.inOut" }, 2.85);
    tl.to("#s3-cursor", { x: 300, y: 560, duration: 0.55, ease: "power2.inOut" }, 2.85);
    tl.to("#s3-cursor", { scale: 0.86, duration: 0.1, ease: "power2.out" }, 3.45);
    tl.to("#s3-cursor", { scale: 1, duration: 0.1, ease: "power2.out" }, 3.55);
    const lt = [3.55, 3.7, 3.85, 4.0, 4.15];
    lt.forEach((t, i) => {
      show("s3-launch" + (i + 1), t);
      if (i > 0) hide("s3-launch" + i, t); else hide("s3-type6", t);
    });
    tl.to("#s3-cursor", { opacity: 0, duration: 0.15 }, 3.75);
    // la carte devient la fenêtre de l'appli (elle part du centre de la carte)
    tl.fromTo("#s3-dim", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power2.out" }, 4.1);
    tl.fromTo("#s3-win", { opacity: 0, scale: 0.28, x: -560, y: 150, transformOrigin: "50% 50%" },
              { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, 4.1);
    tl.to("#s3-win", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, 5.45);
    // retour au lanceur : zoom sur les jauges, 64 -> 65 tours
    tl.fromTo("#s3-zoom", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 5.35);
    tl.fromTo("#s3-zoomcam", { scale: 1.7, transformOrigin: "420px 260px" }, { scale: 2.25, transformOrigin: "420px 260px", duration: 1.8, ease: "power2.out" }, 5.35);
    show("s3-zl", 6.4); hide("s3-zg", 6.4);
    tl.fromTo("#s3-zoomcam", { y: 0 }, { y: -10, duration: 0.12, ease: "power3.out", yoyo: true, repeat: 1 }, 6.4);
    window.__timelines["s3-garage"] = tl;
  </script>
