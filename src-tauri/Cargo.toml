[package]
name = "portabl-apps"
version = "0.4.0"
description = "Porta[b]l Apps — lanceur local pour applis standalone"
edition = "2021"

[lib]
name = "portabl_apps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pelite = "0.10"
base64 = "0.22"
url = "2"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
