<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Orbitron"; font-weight: 900; src: url(../../src/fonts/orbitron-latin-900-normal.woff2) format("woff2"); }
@font-face { font-family: "Orbitron"; font-weight: 700; src: url(../../src/fonts/orbitron-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Chakra Petch"; font-weight: 600; src: url(../../src/fonts/chakra-petch-latin-600-normal.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1280px; height: 400px; overflow: hidden; background: #0b0614; position: relative; font-family: "Chakra Petch", sans-serif; }
.sky { position: absolute; inset: 0; background: linear-gradient(180deg, #0b0614 0%, #1d0a3a 45%, #6a0f6e 62%, #0b0614 62.2%); }
.sun { position: absolute; left: 50%; top: 40px; width: 300px; height: 300px; translate: -50% 0; border-radius: 50%;
  background: linear-gradient(180deg, #ffe45c 0%, #ff8a3d 45%, #ff2bd6 100%);
  mask-image: linear-gradient(180deg, #000 55%, transparent 55%), repeating-linear-gradient(180deg, #000 0 9px, transparent 9px 13px);
  box-shadow: 0 0 120px rgba(255,43,214,.5); opacity: .38; }
.road { position: absolute; left: -40%; right: -40%; top: 248px; bottom: 0; perspective: 200px; overflow: hidden; }
.grid { position: absolute; inset: -100% 0 0 0; transform: rotateX(72deg); transform-origin: bottom;
  background: linear-gradient(90deg, rgba(0,240,255,.6) 1px, transparent 1px) 0 0/60px 60px, linear-gradient(0deg, rgba(255,43,214,.6) 1px, transparent 1px) 0 0/60px 60px;
  mask-image: linear-gradient(0deg, #000 30%, transparent 85%); }
.content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 34px; padding-bottom: 36px; }
.logo { width: 150px; height: 150px; filter: drop-shadow(0 0 18px #ff2bd6); }
h1 { font: italic 900 82px/1 Orbitron, sans-serif; letter-spacing: .1em;
  background: linear-gradient(180deg, #fff 10%, #00f0ff 45%, #ff2bd6 80%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 16px rgba(255,43,214,.55)); white-space: nowrap; }
h1 .b { font: 600 .78em 'Chakra Petch', sans-serif; font-style: normal; letter-spacing: 0; margin: 0 .06em; -webkit-text-fill-color: #00f0ff; }
.tag { margin-top: 14px; font: 600 21px "Chakra Petch"; letter-spacing: .42em; text-transform: uppercase; color: #c9b3e6; }
.tag i { font-style: normal; color: #00f0ff; }
.flag { position: absolute; left: 0; right: 0; bottom: 0; height: 24px;
  background: conic-gradient(#fff 25%, #0b0614 0 50%, #fff 0 75%, #0b0614 0) 0 0/24px 24px; opacity: .9; }
</style></head><body>
<div class="sky"></div><div class="sun"></div><div class="road"><div class="grid"></div></div>
<div class="content">
  <svg class="logo" viewBox="0 0 64 64"><path d="M12 44 A22 22 0 1 1 52 44" fill="none" stroke="#ff2bd6" stroke-width="6" stroke-linecap="round"/><line x1="32" y1="40" x2="46" y2="26" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="40" r="5" fill="#f6eaff"/></svg>
  <div><h1>PORTA<span class="b">[B]</span>L APPS</h1><p class="tag">garage d'applis <i>·</i> local <i>·</i> hors réseau</p></div>
</div>
<div class="flag"></div>
</body></html>
